name: curie
description: "Curie — Xray client for Android (iOS planned)."
publish_to: 'none'
version: 26.11.27+3632481

environment:
  sdk: ^3.14.0

dependencies:
  crypto: ^3.0.6
  cryptography: ^2.9.0
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.4.1
  image_picker: ^1.2.4
  material_ui: ^1.1.0
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Иконки генерируются из branding/icon*.png командой:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  min_sdk_android: 24
