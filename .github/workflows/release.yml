name: release

# Релиз создаётся только по тегу v* — обычные push проверяет build.yml.
# Тэг можно сделать локально: powershell -File scripts\tag-release.ps1
on:
  push:
    tags:
      - 'v*'

# Одна Android-сборка за раз: параллельный build.yml ловил 429 от Maven Central.
concurrency:
  group: curie-android-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch core (libXray.aar)
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('core.lock.json', encoding='utf-8-sig'))['version'])")
          expected=$(python3 -c "import json;print(json.load(open('core.lock.json', encoding='utf-8-sig'))['sha256'])")
          url="https://github.com/XTLS/libXray/releases/download/$version/libxray-android.zip"
          curl -fsSL "$url" -o /tmp/core.zip
          echo "$expected  /tmp/core.zip" | sha256sum -c -
          mkdir -p app/android/app/libs
          unzip -o -j /tmp/core.zip -d app/android/app/libs

      - name: Expose core version for release notes
        id: core
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('core.lock.json', encoding='utf-8-sig'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Expose Rust core version for release notes
        id: rust
        run: |
          set -euo pipefail
          version=$(python3 -c "import re;print(re.search(r'xray-rust-mobile:([0-9][0-9A-Za-z.+-]*)', open('app/android/app/build.gradle.kts', encoding='utf-8').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # NDK не нужен: libXray.aar содержит готовые .so, своего нативного кода нет.

      - name: Analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Use shared signing key
        run: |
          set -euo pipefail
          test -n "$CURIE_DEBUG_KEYSTORE_BASE64" || { echo "Секрет CURIE_DEBUG_KEYSTORE_BASE64 не задан"; exit 1; }
          printf '%s' "$CURIE_DEBUG_KEYSTORE_BASE64" | base64 -d > app/android/app/debug.keystore
          test -s app/android/app/debug.keystore
        env:
          CURIE_DEBUG_KEYSTORE_BASE64: ${{ secrets.CURIE_DEBUG_KEYSTORE_BASE64 }}

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Prepare release assets
        run: |
          set -euo pipefail
          src="app/build/app/outputs/flutter-apk"
          for variant in universal arm64-v8a armeabi-v7a x86_64; do
            case "$variant" in
              universal) apk="$src/app-release.apk" ;;
              *) apk="$src/app-$variant-release.apk" ;;
            esac
            name="curie-${GITHUB_REF_NAME}-$variant.apk"
            test -s "$apk" || { echo "Нет APK: $apk"; exit 1; }
            cp "$apk" "$name"
            sha256sum "$name" > "$name.sha256"
            ls -lh "$name"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Xray-core: ${{ steps.core.outputs.version }}
            libXray: ${{ steps.core.outputs.version }}
            xray-rust: ${{ steps.rust.outputs.version }}
          files: |
            curie-*.apk
            curie-*.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
