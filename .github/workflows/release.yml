name: release

# Релиз создаётся только по тегу v* — обычные push проверяет build.yml.
# Тэг можно сделать локально: powershell -File scripts\tag-release.ps1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch core (libXray.aar)
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('core.lock.json', encoding='utf-8-sig'))['version'])")
          expected=$(python3 -c "import json;print(json.load(open('core.lock.json', encoding='utf-8-sig'))['sha256'])")
          url="https://github.com/XTLS/libXray/releases/download/$version/libxray-android.zip"
          curl -fsSL "$url" -o /tmp/core.zip
          echo "$expected  /tmp/core.zip" | sha256sum -c -
          mkdir -p app/android/app/libs
          unzip -o -j /tmp/core.zip -d app/android/app/libs

      # NDK не нужен: libXray.aar содержит готовые .so, своего нативного кода нет.

      - name: Analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build release APKs
        working-directory: app
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Prepare release assets
        run: |
          set -euo pipefail
          out="app/build/app/outputs/flutter-apk"
          base="curie-${GITHUB_REF_NAME}"
          cp "$out/app-release.apk" "${base}-universal.apk"
          cp "$out/app-arm64-v8a-release.apk" "${base}-arm64.apk"
          cp "$out/app-armeabi-v7a-release.apk" "${base}-arm32.apk"
          cp "$out/app-x86_64-release.apk" "${base}-x64.apk"
          for f in curie-*.apk; do sha256sum "$f" > "$f.sha256"; done
          ls -lh curie-*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            curie-*.apk
            curie-*.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
